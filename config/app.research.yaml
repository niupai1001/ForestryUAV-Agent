# 定向对照（单因子，可随时删除本行还原）：任务07在第6个请求以 layer=generation 撞满300秒。
# 27B 在 32K 上下文下约 11.7 tok/s，300 秒只够约3500个输出token，思考流会先吃掉大半预算。
# 探针 probe-thinking-effort.json：reasoning_effort=none 使 thinking 291→0 字符，
# 同样时间内正文 554→1235 字符；think:false 无效。请求上限本身保持300秒不变。
