services:
  runtime:
    build: .
    container_name: forestry-runtime
    ports:
      - "127.0.0.1:8010:8010"
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3.5:4b
      MAX_UPLOAD_BYTES: "536870912"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
