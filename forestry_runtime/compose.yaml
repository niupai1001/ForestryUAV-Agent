services:
  runtime:
    build:
      context: .
      # `core` has no scientific stack, so building it while
      # REMOTE_SENSING_PLUGINS_ENABLED=true makes the coordinator die on import --
      # the plugin imports numpy at load time, not at call time. The default follows
      # the plugin switch, which is the setting that decides whether the stack is
      # needed. Set RUNTIME_IMAGE_TARGET=core only with the plugin switched off.
      target: ${RUNTIME_IMAGE_TARGET:-remote-sensing}
    container_name: forestry-runtime
    ports:
      - "127.0.0.1:8010:8010"
    env_file: .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8:27b}
      HOST_BRIDGE_URL: ${HOST_BRIDGE_URL:-http://host.docker.internal:8011}
      HOST_BRIDGE_KEY: ${HOST_BRIDGE_KEY}
      RUNTIME_DATA_HOST_ROOT: ${RUNTIME_DATA_HOST_ROOT}
      KNOWLEDGE_ROOTS: /knowledge
      DOMAIN_GUIDE_ROOTS: /knowledge/guides
      DOMAIN_GUIDE_VERIFICATION: /guide-verification/GUIDE_VERIFICATION.md
      REMOTE_SENSING_PLUGINS_ENABLED: ${REMOTE_SENSING_PLUGINS_ENABLED:-false}
      PYDANTIC_AI_NO_BANNER: "1"
      MAX_UPLOAD_BYTES: "536870912"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - type: bind
        source: ${KNOWLEDGE_HOST_ROOT:-./knowledge}
        target: /knowledge
        read_only: true
      - type: bind
        source: ./evaluation/grounded_v1/GUIDE_VERIFICATION.md
        target: /guide-verification/GUIDE_VERIFICATION.md
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
