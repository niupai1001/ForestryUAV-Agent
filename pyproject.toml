[project]
name = "forestry-uav-agent"
version = "0.1.0"
description = "Local general agent with evidence-based forestry UAV workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[openai]>=2.43,<3",
  "pydantic-ai-harness>=0.31,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "psutil>=7,<8",
  "Jinja2>=3.1,<4",
  "pypdf>=6,<7",
  "packaging>=25,<27",
  "resolvelib>=1.2,<2",
  "laspy>=2.7,<3",
  "pyproj>=3.7,<4",
  "pillow>=11,<13",
]

[project.scripts]
forestry-agent = "forestry_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forestry_agent"]

[tool.hatch.build.targets.wheel.force-include]
"config/methods" = "forestry_agent/methods"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["offline_web: exercise the production default with deferred web capabilities disabled"]

[tool.ruff]
line-length = 110
target-version = "py312"

